services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: staffcoord
      POSTGRES_USER: ${DB_OWNER_USER:-staffowner}
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD:?set DB_OWNER_PASSWORD in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["127.0.0.1:5433:5432"]
  api:
    build: ./backend
    depends_on: [db]
    environment:
      DB_URL: jdbc:postgresql://db:5432/staffcoord
      DB_OWNER_USER: ${DB_OWNER_USER:-staffowner}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?set DB_APP_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    ports: ["127.0.0.1:8080:8080"]
volumes:
  pgdata:
